<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>Ticket Manager</h1><a href="index.html">Booking page</a></header><section class="card" id="loginCard"><h2>Admin login</h2><form id="loginForm"><label>Email<input id="loginEmail" type="email" required></label><label>Password<input id="loginPassword" type="password" required></label><button>Sign in</button></form><p id="loginMsg"></p></section><div id="adminArea" hidden><section class="card"><div class="row"><h2>Ticket inventory</h2><button id="refresh" class="secondary">Refresh inventory</button></div><div id="stats" class="stats"></div><p class="muted">Green = available; blue = issued; red = redeemed; grey = cancelled. Only green tickets can be selected.</p><div class="filters"><label>Search serial<input id="searchSerial" placeholder="e.g. 1321"></label><label>Status<select id="statusFilter"><option value="available">Available</option><option value="all">All</option><option value="issued">Issued</option><option value="redeemed">Redeemed</option><option value="cancelled">Cancelled</option></select></label></div><div id="grid" class="grid"></div><p id="selectedCount" class="muted">0 selected</p></section><section class="card"><h2>Issue selected tickets</h2><form id="issueForm"><label>Buyer name<input id="buyerName" required></label><label>Buyer email / contact<input id="buyerEmail" required></label><label>WhatsApp number<input id="buyerPhone"></label><div class="row"><label>Payment method<select id="paymentMethod"><option>Cash</option><option>Online</option></select></label><label>Amount received (₹)<input id="amount" type="number" min="0" step="1"></label></div><label>Payment note<textarea id="paymentNote" rows="2" placeholder="Cash received / UPI reference / other note"></textarea></label><button id="issueBtn">Issue & generate PDFs</button></form><p id="issueMsg"></p><div id="issuedFiles"></div></section><section class="card"><h2>Redeem a ticket</h2><label>QR token<input id="redeemToken" placeholder="Paste scanned ticket token"></label><button id="redeemBtn" class="secondary">Redeem ticket</button><p id="redeemMsg"></p></section><section class="card"><h2>Master register</h2><button id="export" class="secondary">Export CSV</button><div id="register"></div></section><button id="logout" class="secondary">Sign out</button></div></main><script type="module" src="js/admin.js"></script></body></html>
