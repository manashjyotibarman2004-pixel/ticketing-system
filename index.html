<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticket Booking Request</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><header><h1>Ticket Booking</h1><a href="admin.html">Admin</a></header><section class="card"><h2>Request tickets</h2><p class="muted">This is a booking request only. Tickets are issued after the organiser confirms payment and assigns ticket numbers.</p><form id="requestForm"><label>Name<input id="name" required maxlength="100"></label><label>Email / contact<input id="email" required maxlength="150"></label><label>WhatsApp number<input id="phone" required maxlength="30"></label><label>Quantity<input id="quantity" type="number" min="1" max="20" value="1"></label><button>Submit request</button></form><p id="requestMsg"></p></section></main><script type="module" src="js/public.js"></script></body></html>
